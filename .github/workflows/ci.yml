name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: jev-agent/package-lock.json

      - name: Install jev-agent
        working-directory: jev-agent
        run: npm ci --no-audit --no-fund

      - name: Verify local Mineflayer movement patch
        working-directory: jev-agent
        run: npm run movement-patch:check

      - name: Typecheck jev-agent
        working-directory: jev-agent
        run: npm run typecheck

      - name: Deterministic guard tests
        working-directory: jev-agent
        run: npm run guard-test

      - name: Jev gating tests
        working-directory: jev-agent
        run: npm run gating-test

      - name: Lookahead loop tests
        working-directory: jev-agent
        run: npm run loop-test

      - name: Gateway System 2 boundary tests
        working-directory: jev-agent
        run: npm run system2-test

      - name: Architecture audit tests
        working-directory: jev-agent
        run: npm run audit-test

      - name: M1 deterministic tests
        working-directory: jev-agent
        run: npm run m1-test

      - name: Step cut tests
        working-directory: jev-agent
        run: npm run step-cut-test

      - name: Step pipeline tests
        working-directory: jev-agent
        run: npm run step-pipeline-test

      - name: Install resident driver
        working-directory: buddy-driver
        run: npm install --no-audit --no-fund

      - name: Typecheck resident driver
        working-directory: buddy-driver
        run: npm run typecheck

      - name: Bundle reloadable generation
        working-directory: buddy-driver
        run: npm run build
