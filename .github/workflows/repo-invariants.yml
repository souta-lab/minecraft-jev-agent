name: repo-invariants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Known-red runner contract
        run: npm run known-red-runner-test
      - name: Deterministic convergence suite
        run: node tools/known-red-runner.mjs --suite convergence --out artifacts/convergence-results.json
      - name: Compare convergence result against pinned baseline
        if: always()
        run: node tools/known-red.mjs --baseline tools/known-red-baseline.json --current artifacts/convergence-results.json --json
      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-known-red
          path: artifacts/convergence-results.json
          if-no-files-found: error

  core-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jev-agent/package-lock.json
      - name: Deterministic core suite
        run: node ../tools/known-red-runner.mjs --suite core-deterministic --out ../artifacts/core-results.json
      - name: Compare core result against pinned baseline
        if: always()
        run: node ../tools/known-red.mjs --baseline ../tools/known-red-baseline.json --current ../artifacts/core-results.json --json
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-known-red
          path: artifacts/core-results.json
          if-no-files-found: error
