name: repo-invariants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install Bun workspace
        run: bun install --frozen-lockfile
      - name: Verify movement patch
        run: bun run movement-patch:check
      - name: Bun migration residue gate
        run: bun run bun-residue-check
      - name: Frontier fixtures
        run: bun run frontier-test
      - name: Issue-state fixtures
        run: bun run issue-state-test
      - name: Issue graph fixtures
        run: bun run issue-graph-test
      - name: Current-status fixtures
        run: bun run current-status-test
      - name: CI verdict classification fixtures (issue #299)
        run: bun run ci-classify-test
      - name: Lane-guard fixtures
        run: bun run lane-guard-test
      - name: Milestone contract fixtures
        run: bun run milestone-status:check && bun run milestone-status-test
      - name: M2 evidence tooling fixtures
        run: bun run m2-watch-test && bun run m2-acceptance-test && bun run m2-live-gate-test && bun run m2-gate-test
      - name: Live issue-routing invariant
        run: bun run frontier:check
      - name: Live issue-evidence invariant
        run: bun run issue-state:check

  authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Bun workspace
        run: bun install --frozen-lockfile
      - name: Verify movement patch
        run: bun run movement-patch:check
      - name: Resident typecheck
        working-directory: buddy-driver
        run: bun run typecheck
      - name: System2 and Jev authority swap points
        working-directory: buddy-driver
        run: bun run authority-test
      - name: Jev-owned anti-flap commitment
        working-directory: jev-agent
        run: bun test ./test-anti-flap.mts

  core-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jev-agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Bun workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify movement patch
        working-directory: .
        run: bun run movement-patch:check
      - name: Typecheck
        run: bun run typecheck
      - name: Mechanics truth
        run: bun run game-data-test && bun run minecraft-truth-test
      - name: Option and verification semantics
        run: bun run option-spec-test && bun run action-verify-test && bun run truth-causal-test && bun run protected-goals-test
      - name: Truthful retrieve outcome
        run: bun run retrieve-truthful-outcome-test
      - name: Retrieve failure memory
        run: bun run retrieve-failure-memory-test
      - name: Grounded reachability
        run: bun run reachability-test
      - name: Level-scan prerequisite and envelope fixtures
        run: bun run level-scan-test
      - name: Recovery policy regressions
        run: bun run candidate-policy-test && bun run move-failmem-test && bun run pit-escape-test && bun run pillar-search-test && bun run hop-policy-test && bun run pillar-jump-test && bun run pillar-apex-test

  jev-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: jev-harness
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Bun workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify movement patch
        working-directory: .
        run: bun run movement-patch:check
      - name: Harness typecheck
        run: bun run typecheck
      - name: Harness invariants I1-I12 and section 25 regressions
        run: bun test --timeout=120000 --max-concurrency=1 ./bun-tests
      - name: Jev import firewall (section 22 I1/I10)
        working-directory: .
        run: bun jev-harness/tools/firewall.ts

  system2-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: system2-harness
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Bun workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify movement patch
        working-directory: .
        run: bun run movement-patch:check
      - name: Harness typecheck
        run: bun run typecheck
      - name: Harness invariants S1-S15, the 25 fixtures, and the real SDK transport
        run: bun test --timeout=120000 --max-concurrency=1 ./bun-tests
