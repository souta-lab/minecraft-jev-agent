name: repo-invariants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontier fixtures
        run: npm run frontier-test
      - name: Issue graph fixtures
        run: npm run issue-graph-test
      - name: Current-status fixtures
        run: npm run current-status-test
      - name: Lane-guard fixtures
        run: npm run lane-guard-test
      - name: Live issue-routing invariant
        run: npm run frontier:check
